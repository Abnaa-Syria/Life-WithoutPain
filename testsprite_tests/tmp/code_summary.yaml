version: "2"
type: backend
app: patient
tech_stack:
  - Node.js
  - Express.js
  - MySQL
  - Prisma
  - JWT
  - Zod
api_base: /api/v1/patient
auth:
  login_endpoint: POST /api/v1/patient/auth/login
  login_body: '{"phoneNumber": "+966522222222", "password": "Password123"}'
  response_tokens: data.accessToken, data.refreshToken
  header: Authorization Bearer {accessToken}
  otp_stub: "12345"
features:
  - name: Patient Auth
    entry_route: /api/v1/patient/auth/login
    auth_required: false
    api_calls:
      - method: POST
        endpoint: /api/v1/patient/auth/register
      - method: POST
        endpoint: /api/v1/patient/auth/login
      - method: POST
        endpoint: /api/v1/patient/auth/verify-otp
      - method: POST
        endpoint: /api/v1/patient/auth/resend-otp
      - method: POST
        endpoint: /api/v1/patient/auth/refresh-token
      - method: POST
        endpoint: /api/v1/patient/auth/forgot-password
      - method: POST
        endpoint: /api/v1/patient/auth/reset-password
      - method: POST
        endpoint: /api/v1/patient/auth/logout
      - method: GET
        endpoint: /api/v1/patient/auth/me
      - method: POST
        endpoint: /api/v1/patient/auth/change-password
      - method: DELETE
        endpoint: /api/v1/patient/auth/account
  - name: Patient Profile
    entry_route: /api/v1/patient/profile
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/profile
      - method: PUT
        endpoint: /api/v1/patient/profile
      - method: PATCH
        endpoint: /api/v1/patient/profile
  - name: Medical Catalog
    entry_route: /api/v1/patient/medical-catalog/chronic-diseases
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/medical-catalog/chronic-diseases
      - method: GET
        endpoint: /api/v1/patient/medical-catalog/medications
  - name: Medical Profile
    entry_route: /api/v1/patient/medical-profile
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/medical-profile
      - method: PUT
        endpoint: /api/v1/patient/medical-profile
      - method: GET
        endpoint: /api/v1/patient/medical-profile/attachments
      - method: POST
        endpoint: /api/v1/patient/medical-profile/attachments
      - method: POST
        endpoint: /api/v1/patient/medical-profile/chronic-diseases/:id
      - method: DELETE
        endpoint: /api/v1/patient/medical-profile/chronic-diseases/:id
      - method: POST
        endpoint: /api/v1/patient/medical-profile/medications/:id
      - method: DELETE
        endpoint: /api/v1/patient/medical-profile/medications/:id
  - name: Medical Timeline
    entry_route: /api/v1/patient/medical-timeline
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/medical-timeline
  - name: Family Members
    entry_route: /api/v1/patient/family-members
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/family-members
      - method: POST
        endpoint: /api/v1/patient/family-members
      - method: PUT
        endpoint: /api/v1/patient/family-members/:id
      - method: DELETE
        endpoint: /api/v1/patient/family-members/:id
  - name: Insurances
    entry_route: /api/v1/patient/insurances
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/insurances/providers
      - method: GET
        endpoint: /api/v1/patient/insurances
      - method: POST
        endpoint: /api/v1/patient/insurances
      - method: PUT
        endpoint: /api/v1/patient/insurances/:id
      - method: DELETE
        endpoint: /api/v1/patient/insurances/:id
  - name: Insurance Requests
    entry_route: /api/v1/patient/insurance-requests
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/insurance-requests
      - method: GET
        endpoint: /api/v1/patient/insurance-requests/:id
  - name: Files
    entry_route: /api/v1/patient/files
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/files
      - method: POST
        endpoint: /api/v1/patient/files
  - name: Appointments
    entry_route: /api/v1/patient/appointments
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/appointments/upcoming
      - method: GET
        endpoint: /api/v1/patient/appointments
      - method: POST
        endpoint: /api/v1/patient/appointments/book/personal
      - method: POST
        endpoint: /api/v1/patient/appointments/book/family
      - method: POST
        endpoint: /api/v1/patient/appointments
      - method: GET
        endpoint: /api/v1/patient/appointments/:id
      - method: GET
        endpoint: /api/v1/patient/appointments/:id/session
      - method: PATCH
        endpoint: /api/v1/patient/appointments/:id/cancel
      - method: PATCH
        endpoint: /api/v1/patient/appointments/:id/reschedule
  - name: Bookings
    entry_route: /api/v1/patient/bookings
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/bookings
  - name: Home Services
    entry_route: /api/v1/patient/home-services
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/home-services
      - method: POST
        endpoint: /api/v1/patient/home-services
      - method: GET
        endpoint: /api/v1/patient/home-services/:id
      - method: PATCH
        endpoint: /api/v1/patient/home-services/:id/cancel
  - name: Doctors Search
    entry_route: /api/v1/patient/doctors/search
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/doctors/search
      - method: GET
        endpoint: /api/v1/patient/doctors/:id/availability
      - method: GET
        endpoint: /api/v1/patient/doctors/:id
  - name: Specializations
    entry_route: /api/v1/patient/specializations
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/specializations
      - method: GET
        endpoint: /api/v1/patient/specializations/:id/doctors
      - method: GET
        endpoint: /api/v1/patient/specializations/:id
  - name: Sub-Specializations
    entry_route: /api/v1/patient/sub-specializations
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/sub-specializations
  - name: Services
    entry_route: /api/v1/patient/services
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/services
      - method: GET
        endpoint: /api/v1/patient/services/:id
  - name: Directories
    entry_route: /api/v1/patient/directories
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/directories
  - name: Medical Records
    entry_route: /api/v1/patient/prescriptions
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/prescriptions
      - method: GET
        endpoint: /api/v1/patient/prescriptions/:id
      - method: GET
        endpoint: /api/v1/patient/prescriptions/:id/pdf
      - method: GET
        endpoint: /api/v1/patient/reports
      - method: GET
        endpoint: /api/v1/patient/reports/:id
      - method: GET
        endpoint: /api/v1/patient/reports/:id/pdf
      - method: GET
        endpoint: /api/v1/patient/x-rays
      - method: GET
        endpoint: /api/v1/patient/x-rays/:id
      - method: GET
        endpoint: /api/v1/patient/x-rays/:id/pdf
  - name: Conversations
    entry_route: /api/v1/patient/conversations
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/conversations
      - method: POST
        endpoint: /api/v1/patient/conversations
      - method: GET
        endpoint: /api/v1/patient/conversations/:id
      - method: GET
        endpoint: /api/v1/patient/conversations/:id/messages
      - method: POST
        endpoint: /api/v1/patient/conversations/:id/messages
      - method: PATCH
        endpoint: /api/v1/patient/conversations/:id/messages/:messageId/read
  - name: Call Sessions
    entry_route: /api/v1/patient/call-sessions/by-appointment/:appointmentId
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/call-sessions/by-appointment/:appointmentId
  - name: Payments
    entry_route: /api/v1/patient/payments
    auth_required: true
    api_calls:
      - method: POST
        endpoint: /api/v1/patient/payments/initiate
      - method: GET
        endpoint: /api/v1/patient/payments
      - method: GET
        endpoint: /api/v1/patient/payments/:id
  - name: Support
    entry_route: /api/v1/patient/support/info
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/support/info
      - method: GET
        endpoint: /api/v1/patient/support/tickets
      - method: POST
        endpoint: /api/v1/patient/support/tickets
      - method: GET
        endpoint: /api/v1/patient/support/tickets/:id
      - method: POST
        endpoint: /api/v1/patient/support/tickets/:id/messages
  - name: Settings
    entry_route: /api/v1/patient/settings
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/settings
      - method: PATCH
        endpoint: /api/v1/patient/settings
  - name: Notifications
    entry_route: /api/v1/patient/notifications
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/notifications
      - method: PATCH
        endpoint: /api/v1/patient/notifications/read-all
      - method: PATCH
        endpoint: /api/v1/patient/notifications/:id/read
  - name: Lab Tests
    entry_route: /api/v1/patient/lab-tests
    auth_required: true
    api_calls:
      - method: GET
        endpoint: /api/v1/patient/lab-tests
      - method: GET
        endpoint: /api/v1/patient/lab-tests/:id
      - method: GET
        endpoint: /api/v1/patient/lab-tests/:id/pdf
      - method: GET
        endpoint: /api/v1/patient/lab-tests/:id/results
known_limitations: []
testing_notes:
  - Auth JWT is response.data.accessToken (same as admin login)
  - Doctor session check GET /api/v1/doctor/auth/me returns data.profileId
  - Report/lab-test create may omit patientId/appointmentId; server picks latest doctor appointment
  - Rate limiting disabled when NODE_ENV is not production
